[project]
name = "lisa-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jemuel B Jeroham", email = "jemuelbjeroham@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[project.scripts]
lisa-mcp-server = "lisa_mcp_server:main"

[build-system]
